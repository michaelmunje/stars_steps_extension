# Proof of concept: CMA-ES whose fitness is a judge's labels of rendered episodes
# (simplenavsim.optimization.judge, simplenavsim/scripts/judged_cmaes.py).
# CPU-sized: reactive-replay pedestrians and a constant-velocity predictor, so no STARS weights or GPU.
simulator: /scratch/09865/mmunje/stars-forecasting/simplenavsim/configs/simulator.yaml
pedestrians: /scratch/09865/mmunje/stars-forecasting/simplenavsim/configs/pedestrians.yaml          # reactive_replay
policy:
  name: social
  controller:
    num_speeds: 6
    num_turn_rates: 11
    plan_dt: 0.2
    max_horizon: 4.0
    safety_horizon: 1.0
    safety_margin: 0.05
    obstacle_clearance: 0.6
    speed_cost: 0.5
    retreat_cost: 2.0
    disruption_lookahead: 1.5
  parameters: {}
  predictor: {type: constant_velocity}
judged:
  # 6 of the 13 weights: the ones that set how close, how fast and how far ahead the robot plans
  optimize: [goal_weight, pedestrian_weight, personal_space_radius, preferred_speed, prediction_horizon,
             smoothness_weight]
  population_size: 12
  generations: 400
  sigma0: 0.3                # in the unit cube; wide enough that a 6-candidate generation differs visibly
  seed: 7
  scenes_per_generation: 4
  kinds: [head_on, group_toward, crossing, narrow_passage, stationary_group, dense_flow, overtaking]
  duration: 30.0
  dt: 0.1
  test_kinds: [head_on, crossing, group_toward, narrow_passage, stationary_group, dense_flow]   # report.py
# The hand-written objective, computed for every episode but NOT used as fitness: kept to compare
# the judge with it. No robot_influence here (it needs the STARS crowd), so that term is 0.
objective:
  success: 1.0
  collision: 2.0
  disruption: 1.0
  time: 0.3
  comfort: 1.0
  detour: 1.0
  smoothness: 0.1
  circling: 0.2
  disruption_metric: robot_influence
  comfort_metric: intimate_violation_rate
