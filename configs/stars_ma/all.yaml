# Multi-agent STARS on every converted dataset at once (pretraining mixture).
# ATC is left out until its scene index is built (python -m preprocess datasets/atc ...).
# Validation reports each dataset separately; checkpoints are selected on their mean agent ADE.
datasets:
  - steps
  - ptdpes
  - madras
  - grand_central      # temporal split (registered default)
  - ucy
  - eth
# Mixed six-dataset batches need a lower peak LR than STEPS alone: the Optuna LR (9.6e-4, tuned on
# STEPS) made pooled training seed-sensitive; 3e-4 is robust across seeds.
learning_rate: 3.0e-4
