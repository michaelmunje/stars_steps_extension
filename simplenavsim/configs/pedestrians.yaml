# Pedestrian model: replay | social_force | reactive_replay | orca
model: reactive_replay
social_force:            # shared by social_force and reactive_replay
  tau: 0.5
  ped_strength: 2.1
  ped_range: 0.3
  robot_strength: 5.0
  robot_range: 0.5
  obstacle_strength: 10.0
  obstacle_range: 0.2
  anisotropy: 0.35
  sidestep: 0.5          # sideways share of repulsion (pass instead of stalling head-on)
  interaction_radius: 5.0
  max_acceleration: 3.0
  max_speed_factor: 1.3
  arrival_distance: 0.3
reactive_replay:
  tracking_gain: 1.0     # reference-tracking strength (1/s)
  max_overrun: 10.0      # s a pedestrian may run past the end of its reference
# orca:                  # used when model: orca (RVO2-style ORCA; social_force keys are ignored)
#   mode: reactive_replay  # reactive_replay (track the reference) | goal (walk to its end point)
#   neighbor_dist: 5.0
#   max_neighbors: 10
#   time_horizon: 2.0      # s, pedestrian-pedestrian (reciprocal)
#   time_horizon_obst: 1.0 # s, walls and circles
#   robot_time_horizon: 2.0  # s, robot (non-reciprocal: pedestrians take full responsibility)
#   max_speed_factor: 1.3
#   tracking_gain: 1.0     # reactive_replay mode (1/s)
#   max_overrun: 10.0      # reactive_replay mode
#   arrival_distance: 0.3
#   obstacles: true
