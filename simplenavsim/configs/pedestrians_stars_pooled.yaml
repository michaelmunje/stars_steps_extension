# Pedestrians driven by the multi-agent STARS forecaster (simplenavsim.pedestrians.stars_crowd). Pooled six-dataset model (decision 87).
model: stars_crowd
stars_crowd:
  checkpoint: experiments/stars_ma/runs/cvae_all_lr3e-4_seed42/checkpoints/best.pt
  device: cuda
  include_robot: true      # the robot is one more person in the forecaster's graph
  seed: 0                  # per-pedestrian intent draws (shared by the robot-absent counterfactual)
