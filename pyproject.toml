[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steps-trajectory-forecasting"
version = "0.1.0"
description = "Unified pedestrian trajectory preprocessing, analysis, and forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate==1.15.0",
  "cma==4.5.0",
  "dill==0.4.1",
  "easydict==1.13",
  "einops==0.8.2",
  "ema-pytorch==0.8.3",
  "filelock==3.20.0",
  "gitpython==3.2.1",
  "glob2==0.7",
  "ijson==3.5.1",
  "matplotlib==3.11.0",
  "ncls==0.0.70",
  "numpy==2.5.1",
  "opencv-python-headless==5.0.0.93",
  "orjson==3.12.0",
  "pandas==3.0.3",
  "pillow==12.0.0",
  "pyarrow==24.0.0",
  "pykalman==0.10.2",
  "pyquaternion==0.9.9",
  "pyyaml==6.0.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.1",
  "seaborn==0.13.2",
  "tensorboardx==2.6.5",
  "torch==2.9.1",
  "torch-geometric==2.8.1",
  "torchvision==0.24.1",
  "tqdm==4.68.4",
  "zstandard==0.24.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "analysis_pipeline",
  "analysis_trajlets",
  "area_calibration",
  "artifact_provenance",
  "canonical",
  "categorization",
  "config",
  "coverage",
  "crowd_density",
  "data",
  "data_quality",
  "dataset_paths",
  "diversity",
  "duplicate_annotations",
  "experiments",
  "forecasting_config",
  "forecasting_representation",
  "forecasting_windows",
  "heading",
  "manifests",
  "metrics",
  "models",
  "normalization",
  "opentraj_dataset_stats",
  "opentraj_indicators",
  "opentraj_report",
  "paper_dataset_metrics",
  "preprocess",
  "preprocessing_views",
  "results",
  "sizing",
  "split_manifests",
  "splits",
  "stats",
  "visualize",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["baselines*", "datasets_preprocessing*", "paper*", "scripts*", "simplenavsim*"]
namespaces = true

[tool.setuptools.package-data]
baselines = ["README.md", "upstream.json"]
datasets_preprocessing = ["**/*.json", "**/*.md"]

# On aarch64 (TACC Horizon GB200) PyPI's torch wheel is CPU-only; take CUDA
# builds from the PyTorch index there. Other platforms keep resolving from PyPI.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
