# Crowd v3 with controller speed_cost 0.2 (decision 68). Otherwise identical to cmaes_crowd_v3.yaml.
#
simulator: simulator.yaml
pedestrians: pedestrians_stars.yaml
policy: policy_stars_best_speed02.yaml
recorded:
  source: steps            # steps | csv (see seanjax.datasets.trajectory_loader)
  path: datasets/steps
  limit_per_split: 40      # recordings loaded per split
  max_pedestrians: 40
  min_pedestrians: 6
cmaes:
  optimize: [goal_weight, pedestrian_weight, disruption_weight, preferred_speed,
             personal_space_radius, prediction_horizon, smoothness_weight, turn_penalty]
  population_size: 32
  num_generations: 100
  sigma0: 0.1
  seed: 42
  kinds: [crossing, head_on, overtaking, following, group_toward, narrow_passage,
          stationary_group, dense_flow, recorded]
  train_per_kind: 8
  val_per_kind: 24       # validation noise was +-0.05 between generations at 12 (decision 58)
  validate_every: 5
  train_refresh_every: 10
  duration: 30.0
  dt: 0.1
test_per_kind: 30       # 30 recorded test scenes; 10 were too few to rank policies (decision 64)
max_envs: 4096
objective:
  success: 1.0
  collision: 2.0
  disruption: 1.0        # robot_influence averages ~0.24 m over this scenario mix, like trajectory disruption elsewhere (decisions 52)
  time: 0.3
  comfort: 1.0
  detour: 1.0            # weight on 1 - path_efficiency (penalises loops and long detours)
  smoothness: 0.1        # weight on command_smoothness (jerky commands)
  disruption_metric: robot_influence    # robot-attributable forecast change; trajectory counterfactuals diverge chaotically in a learned crowd (decisions 49, 51)
  comfort_metric: intimate_violation_rate   # < 0.45 m; the 1.2 m personal-zone rate is ~0.35-0.40 for every policy, even goal-seeking (decision 58)
