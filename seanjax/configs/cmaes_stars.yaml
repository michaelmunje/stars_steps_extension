# STARS-forecaster pedestrian predictions. CMA-ES tuning of the social navigation controller on the lightweight backend.
simulator: simulator.yaml
pedestrians: pedestrians.yaml
policy: policy_stars.yaml
cmaes:
  optimize: [goal_weight, pedestrian_weight, disruption_weight, preferred_speed,
             personal_space_radius, prediction_horizon, smoothness_weight, turn_penalty]
  population_size: 32
  num_generations: 150
  sigma0: 0.25
  seed: 42
  kinds: [crossing, head_on, overtaking, following, group_toward, narrow_passage,
          stationary_group, dense_flow]
  train_per_kind: 6      # fresh scenarios every generation, shared by all candidates
  val_per_kind: 12       # fixed validation set: selects best_policy.yaml
  validate_every: 5
  duration: 30.0
  dt: 0.1
test_per_kind: 10        # untouched test set (evaluate.py)
max_envs: 4096           # environments simulated per batch
objective:
  success: 1.0
  collision: 2.0
  disruption: 1.0
  time: 0.3
  comfort: 0.5
  disruption_metric: disruption_displacement
  comfort_metric: personal_violation_rate
